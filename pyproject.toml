[project]
name = "report-generator"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
generate-report = "report_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_generator"]
include = ["report_generator/configs/*.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort

[tool.ruff.format]
quote-style = "single"
